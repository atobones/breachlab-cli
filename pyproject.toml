[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breachlab"
dynamic = ["version"]
description = "Python SDK and command-line client for BreachLab: submit flags, check your progress and record agent runs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "BreachLab" }]
keywords = ["breachlab", "ctf", "wargame", "security", "cli", "sdk"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://breachlab.org"
Documentation = "https://breachlab.org/docs/api"

[project.scripts]
breachlab = "breachlab.cli:run"

[tool.setuptools.dynamic]
version = { attr = "breachlab._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breachlab = ["py.typed"]
